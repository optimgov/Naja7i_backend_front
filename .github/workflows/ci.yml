name: CI

# PAS-1.1 — Les garanties d'isolation ne valent que si elles sont vérifiées à
# chaque poussée. La suite tourne sur PostgreSQL 16, jamais sur SQLite : les
# migrations utilisent citext, des types ENUM, un index partiel et un trigger
# plpgsql que SQLite ne sait pas exécuter (ADR-0002). Un repli SQLite ferait
# passer la CI au vert en n'exécutant plus rien de ce qu'on cherche à protéger.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: naja7i_test        # base attendue par phpunit.xml
          POSTGRES_USER: naja7i
          POSTGRES_PASSWORD: naja7i_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naja7i"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Suite de tests
        run: php artisan test
        env:
          # PAS-3 — Aucun serveur SMTP dans le job : Mailpit n'existe qu'en
          # développement. Le pilote `log` écrit le message dans le journal
          # plutôt que de tenter une connexion vers 127.0.0.1:1025, qui
          # échouerait. (phpunit.xml impose de toute façon `array` pour la
          # suite ; cette valeur couvre les commandes artisan hors tests.)
          MAIL_MAILER: log

          # PAS-2 — Le contrôle anti-fuite du mot de passe interroge
          # api.pwnedpasswords.com. En intégration continue, cet aller-retour
          # rend la suite lente et dépendante d'un tiers : une panne chez lui
          # ferait rougir un dépôt sain. On le désactive ICI ET SEULEMENT ICI.
          # Jamais en local — le développeur doit voir la règle s'appliquer —
          # et jamais en production, où elle est la principale défense contre
          # la réutilisation d'un mot de passe déjà divulgué (ADR-0007).
          # Une variable d'environnement du système l'emporte sur le .env et
          # sur phpunit.xml : la valeur ci-dessous gagne bien.
          PASSWORD_CHECK_COMPROMISED: 'false'
