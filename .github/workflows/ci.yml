name: CI

# PAS-1.1 — Les garanties d'isolation ne valent que si elles sont vérifiées à
# chaque poussée. La suite tourne sur PostgreSQL 16, jamais sur SQLite : les
# migrations utilisent citext, des types ENUM, un index partiel et un trigger
# plpgsql que SQLite ne sait pas exécuter (ADR-0002). Un repli SQLite ferait
# passer la CI au vert en n'exécutant plus rien de ce qu'on cherche à protéger.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # AJOUT CI/CD — ce workflow devient appelable par un autre.
  #
  # `deploiement.yml` l'invoque au lieu de recopier ses étapes. Une suite de
  # tests dupliquée finit toujours par diverger de son original, et c'est la
  # copie du déploiement qui devient la plus permissive des deux — exactement
  # là où il faudrait qu'elle soit la plus stricte.
  workflow_call:

# `github.workflow` est dans la clé : appelé par `deploiement.yml`, ce
# workflow prend le nom de l'APPELANT. Sans cela, la CI déclenchée par la
# poussée sur main et celle appelée par le déploiement partagent le même
# groupe — et « cancel-in-progress » fait annuler l'une par l'autre. Le job
# de contrôle du déploiement mourait alors sans rien déployer, au hasard de
# l'ordre de démarrage.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: naja7i_test        # base attendue par phpunit.xml
          POSTGRES_USER: naja7i
          POSTGRES_PASSWORD: naja7i_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naja7i"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Suite de tests
        run: php artisan test
        env:
          # PAS-3 — Aucun serveur SMTP dans le job : Mailpit n'existe qu'en
          # développement. Le pilote `log` écrit le message dans le journal
          # plutôt que de tenter une connexion vers 127.0.0.1:1025, qui
          # échouerait. (phpunit.xml impose de toute façon `array` pour la
          # suite ; cette valeur couvre les commandes artisan hors tests.)
          MAIL_MAILER: log

          # PAS-2 — Le contrôle anti-fuite du mot de passe interroge
          # api.pwnedpasswords.com. En intégration continue, cet aller-retour
          # rend la suite lente et dépendante d'un tiers : une panne chez lui
          # ferait rougir un dépôt sain. On le désactive ICI ET SEULEMENT ICI.
          # Jamais en local — le développeur doit voir la règle s'appliquer —
          # et jamais en production, où elle est la principale défense contre
          # la réutilisation d'un mot de passe déjà divulgué (ADR-0007).
          # Une variable d'environnement du système l'emporte sur le .env et
          # sur phpunit.xml : la valeur ci-dessous gagne bien.
          PASSWORD_CHECK_COMPROMISED: 'false'

      # AJOUT CI/CD — ces trois caches sont exactement ce que l'entrypoint de
      # l'image construit à chaque démarrage de conteneur. Une configuration
      # qui ne se met pas en cache (fichier de config qui lève, route
      # dupliquée, écouteur d'événement introuvable) passe la suite de tests
      # sans broncher, puis empêche TOUS les conteneurs de production de
      # démarrer — au déploiement suivant, sans lien visible avec le commit.
      - name: Vérifier que les caches de production se construisent
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          php artisan config:clear

  script-demonstration:
    # DET-77 — Le script de démonstration est le premier contact d'un partenaire
    # avec le produit, et ses trois derniers défauts n'ont été trouvés QU'EN
    # L'EXÉCUTANT. La CI ne peut pas l'exécuter : il lui faudrait PostgreSQL, un
    # Nuxt en développement et deux dépôts côte à côte — un job qui reproduirait
    # tout un poste de travail, et qui casserait pour des raisons sans rapport.
    #
    # Ce qui se vérifie POUR PAS CHER, en revanche : que le fichier est du bash
    # valide et qu'aucune des tournures qui l'ont déjà piégé n'y revienne. Un
    # `|| true` sur une opération dont le résultat compte, une variable non
    # citée, un test à un seul crochet — shellcheck les nomme, et c'est
    # exactement la famille des défauts avalés que la réécriture a chassés.
    #
    # HONNÊTE SUR LA PORTÉE : ce job n'établit PAS que le script produit une
    # plateforme utilisable. Seule une exécution de bout en bout le fait, et
    # elle reste manuelle. Il empêche seulement de pousser un script qui ne
    # démarre même pas.
    name: Script de démonstration (syntaxe et shellcheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe bash
        run: bash -n scripts/demonstration/naja7i-demo.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning scripts/demonstration/naja7i-demo.sh
