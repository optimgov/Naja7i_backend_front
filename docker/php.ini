; Réglages PHP de production — Naja7i backend.
; Le fichier n'est chargé que dans l'image ; le poste de développement garde
; les valeurs par défaut de PHP, plus tolérantes.

expose_php = Off

memory_limit = 256M
max_execution_time = 60

; Les envois de fichiers restent modestes : aucun média n'entre par l'API à ce
; stade. Relever ces deux valeurs le jour où l'import de banque de questions
; passe par HTTP plutôt que par une commande artisan.
upload_max_filesize = 8M
post_max_size = 10M

; Les erreurs vont au flux d'erreur du conteneur, jamais à la réponse HTTP :
; APP_DEBUG=false suffirait côté Laravel, mais une erreur survenue AVANT le
; démarrage du framework (extension manquante, fichier illisible) échapperait
; à son gestionnaire et s'afficherait au candidat.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Le code d'une image ne change jamais : rien ne sert de le vérifier sur disque
; à chaque requête. Un déploiement, c'est un nouveau conteneur.
opcache.validate_timestamps = 0

; Utile seulement si Octane est activé un jour ; sans coût autrement.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

date.timezone = Africa/Casablanca
